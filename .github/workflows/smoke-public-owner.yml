name: One-off real public owner smoke check
on:
  push:
    branches: [feat/year-history-self-service]
    paths: [.github/workflows/smoke-public-owner.yml]

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Collect real PUBLIC account activity to an ephemeral artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m open_source_metro.profile_cli --username AdityaSreevatsaK --output temporary-public-profile --max-repos 5 --pages 2 --layout both --theme midnight
      - name: Report verifiable source coverage
        shell: python
        run: |
          import json
          from pathlib import Path
          data = json.loads(Path('temporary-public-profile/source-snapshot.json').read_text(encoding='utf-8'))
          coverage = data['_coverage']
          print('Owned public repositories selected:', len(data['repositories']))
          print('Public source events observed:', len(data['activity']))
          print('Endpoint requests:', coverage['requests'])
          print('Possible pagination/repository cap:', coverage['possible_history_truncation'])
          print('Not a complete GitHub contribution calendar')
      - name: Upload read-only public snapshot and SVG previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: one-off-real-public-metro
          path: temporary-public-profile/
          retention-days: 7
          if-no-files-found: error
