name: Tests and preview reproducibility
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify committed preview SVGs are reproducible
        run: python -m open_source_metro --input examples/demo-activity.json --output generated
      - name: Compare generated assets with reviewed previews
        shell: python
        run: |
          from pathlib import Path
          assets = Path('assets')
          generated = Path('generated')
          files = ['atlas-midnight-fixture.svg','atlas-midnight-showcase.svg','atlas-parchment-showcase.svg']
          for name in files:
              assert (assets / name).read_bytes() == (generated / name).read_bytes(), f'Export drift: {name}'
