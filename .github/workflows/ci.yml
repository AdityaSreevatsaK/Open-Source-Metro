name: Tests and preview reproducibility
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify committed preview SVGs are reproducible
        run: python -m open_source_metro --input examples/demo-activity.json --output generated
      - name: Compare generated assets with reviewed previews
        shell: python
        run: |
          from pathlib import Path
          assets = Path('assets')
          generated = Path('generated')
          files = ['atlas-midnight-fixture.svg','atlas-midnight-showcase.svg','atlas-parchment-showcase.svg']
          for name in files:
              assert (assets / name).read_bytes() == (generated / name).read_bytes(), f'Export drift: {name}'
      - name: Render Living Network snapshots and themes
        run: |
          python -m open_source_metro.living_network --input examples/demo-activity.json --output generated/living-snapshot
          python -m open_source_metro.living_network --input examples/demo-activity.json --output generated/living-showcase --showcase
          python -m open_source_metro.living_network --input examples/demo-activity.json --output generated/living-paper --showcase --theme paper
      - name: Verify Living Network assets are deterministic and reviewed
        shell: python
        run: |
          from pathlib import Path
          comparisons = [
              ('generated/living-snapshot/living-network-snapshot.svg', 'assets/living-network-snapshot.svg'),
              ('generated/living-snapshot/living-network-snapshot.html', 'assets/living-network-snapshot.html'),
              ('generated/living-showcase/living-network-showcase.svg', 'assets/living-network-showcase.svg'),
              ('generated/living-showcase/living-network-showcase.html', 'assets/living-network-showcase.html'),
              ('generated/living-paper/living-network-showcase.svg', 'assets/living-network-paper-showcase.svg'),
          ]
          for actual, expected in comparisons:
              assert Path(actual).read_bytes() == Path(expected).read_bytes(), f'Living Network export drift: {expected}'
