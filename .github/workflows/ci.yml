name: Tests and preview reproducibility
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify committed preview SVGs are reproducible
        run: python -m open_source_metro --input examples/demo-activity.json --output generated
      - name: Compare generated assets with reviewed previews
        shell: python
        run: |
          from pathlib import Path
          assets = Path('assets')
          generated = Path('generated')
          files = ['atlas-midnight-fixture.svg','atlas-midnight-showcase.svg','atlas-parchment-showcase.svg']
          for name in files:
              assert (assets / name).read_bytes() == (generated / name).read_bytes(), f'Export drift: {name}'
      - name: Render Living Network snapshots and themes
        run: |
          python -m open_source_metro.living_network --input examples/demo-activity.json --output generated/living-snapshot
          python -m open_source_metro.living_network --input examples/demo-activity.json --output generated/living-showcase --showcase
          python -m open_source_metro.living_network --input examples/demo-activity.json --output generated/living-paper --showcase --theme paper
      - name: Verify Living Network assets are deterministic and reviewed
        shell: python
        run: |
          from pathlib import Path
          comparisons = [
              ('generated/living-snapshot/living-network-snapshot.svg', 'assets/living-network-snapshot.svg'),
              ('generated/living-snapshot/living-network-snapshot.html', 'assets/living-network-snapshot.html'),
              ('generated/living-showcase/living-network-showcase.svg', 'assets/living-network-showcase.svg'),
              ('generated/living-showcase/living-network-showcase.html', 'assets/living-network-showcase.html'),
              ('generated/living-paper/living-network-showcase.svg', 'assets/living-network-paper-showcase.svg'),
          ]
          for actual, expected in comparisons:
              assert Path(actual).read_bytes() == Path(expected).read_bytes(), f'Living Network export drift: {expected}'

      - name: Render compact profile editions from example sources
        run: |
          python -m open_source_metro.compact_profile --input examples/demo-activity.json --output generated/living-compact-showcase.svg --showcase
          python -m open_source_metro.compact_profile --input examples/demo-activity.json --output generated/living-compact-paper.svg --showcase --theme paper
          python -m open_source_metro.compact_profile --input examples/demo-activity.json --output generated/living-compact-fixture.svg
      - name: Verify compact SVGs and bounded optional GIF
        shell: python
        run: |
          from pathlib import Path
          import struct
          for filename in ('living-compact-showcase.svg','living-compact-paper.svg','living-compact-fixture.svg'):
              assert (Path('generated') / filename).read_bytes() == (Path('assets') / filename).read_bytes(), f'Compact SVG export drift: {filename}'
          gif = Path('assets/living-compact-replay.gif').read_bytes()
          assert gif[:6] == b'GIF89a' and 100000 <= len(gif) < 1000000, 'Missing, oversize or invalid GIF'
          width, height = struct.unpack('<HH',gif[6:10])
          assert width == 850 and 250 <= height <= 350, f'Unexpected compact GIF dimensions: {width}x{height}'

      - name: Verify mobile 16-week portrait renderer in both themes
        run: |
          python -m open_source_metro.mobile_profile --input examples/demo-activity.json --output generated/mobile-fixture.svg
          python -m open_source_metro.mobile_profile --input examples/demo-activity.json --output generated/mobile-showcase.svg --showcase
          python -m open_source_metro.mobile_profile --input examples/demo-activity.json --output generated/mobile-paper.svg --showcase --theme paper
      - name: Check mobile exported SVGs parse and carry source scope
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('generated').glob('mobile-*.svg'):
              content = path.read_text(encoding='utf-8')
              root = ET.fromstring(content)
              assert root.attrib.get('width') == '460'
              assert root.attrib.get('height') == '808'
              assert 'LATEST 16 WEEKS' in content
              assert 'UNOBSERVED' in content
              expected = Path('assets') / ('living-' + path.name)
              # Source assets follow living-mobile-{fixture,showcase,paper}.svg.
              expected = Path('assets') / path.name.replace('mobile-', 'living-mobile-')
              assert expected.read_bytes() == path.read_bytes(), f'Mobile asset drift: {expected}'

      - name: Verify self-service profile generation without network
        run: |
          python -m open_source_metro.profile_cli --input examples/demo-activity.json --output generated/profile-test --layout both --theme midnight
          python -m open_source_metro.profile_cli --input examples/demo-activity.json --output generated/profile-paper --layout mobile --theme paper
      - name: Check source-backed profile exports and provenance
        shell: python
        run: |
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          root = Path('generated/profile-test')
          snapshot = json.loads((root / 'source-snapshot.json').read_text(encoding='utf-8'))
          assert snapshot['source'] == 'demo'
          assert len(snapshot['activity']) == 10
          assert 'complete contribution' in (root / 'README_SNIPPET.md').read_text(encoding='utf-8').lower()
          for path in (root / 'profile-compact.svg', root / 'profile-mobile.svg', Path('generated/profile-paper/profile-mobile.svg')):
              svg = ET.parse(path).getroot()
              assert svg.tag.endswith('svg')
              assert svg.attrib.get('role') == 'img'
