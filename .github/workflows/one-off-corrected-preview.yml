name: One-off corrected public profile preview
# Final profile regeneration after official GraphQL and contribution intensity changes
on:
  push:
    branches: [fix/real-data-calendar-coverage]
    paths: [.github/workflows/one-off-corrected-preview.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install standalone metro
        run: python -m pip install -e .
      - name: Collect broad public account history and render corrected profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m open_source_metro.profile_cli --username AdityaSreevatsaK --output corrected-real-preview --max-repos 10 --pages 2 --layout both --theme midnight
      - name: Audit official calendar squares independently of public project route events
        shell: python
        run: |
          from datetime import date, datetime, timedelta
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          raw = json.loads(Path('corrected-real-preview/source-snapshot.json').read_text(encoding='utf-8'))
          profile = raw['_calendar']
          assert profile['provider'] == 'github-graphql'
          cutoff = datetime.fromisoformat(raw['generated_at'].replace('Z','+00:00')).date()
          last_sunday = cutoff - timedelta(days=(cutoff.weekday()+1)%7)
          start = last_sunday - timedelta(weeks=52)
          public_events = [
              e for e in raw['activity']
              if start <= datetime.fromisoformat(e['occurred_at'].replace('Z','+00:00')).date() <= cutoff
          ]
          profile_days = [
              d for d in profile['days'] if start <= date.fromisoformat(d['date']) <= cutoff
          ]
          root = ET.parse('corrected-real-preview/profile-compact.svg').getroot()
          tiles = [n for n in root.iter() if n.get('class') == 'calendar-day']
          official_sum = sum(int(n.get('data-count','0')) for n in tiles)
          public_sum = sum(int(n.get('data-source-count','0')) for n in tiles)
          assert official_sum == sum(d['count'] for d in profile_days)
          assert public_sum == len(public_events)
          profile_active = [d for d in profile_days if d['count'] > 0]
          print('GitHub profile calendar reported total:',profile['total_contributions'])
          print('GitHub profile contributions in displayed calendar:',official_sum)
          print('GitHub profile nonzero days in displayed calendar:',len(profile_active))
          print('First/last profile active date:',profile_active[0]['date'] if profile_active else 'none',profile_active[-1]['date'] if profile_active else 'none')
          print('Separate observed public repository events:',public_sum)
          print('Selected public repositories:',len(raw['repositories']))
          print('Public API truncation possible:',raw['_coverage']['possible_history_truncation'])
          print('Account-visible contribution counts are not attributed to project routes.')
      - name: Upload corrected source snapshot and SVG previews for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corrected-public-metro-profile
          path: corrected-real-preview/
          retention-days: 7
          if-no-files-found: error
