name: Temporary official calendar API feasibility check
on:
  push:
    branches: [fix/real-data-calendar-coverage]
    paths: [.github/workflows/probe-graphql-calendar.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query GitHub's public profile contribution calendar
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os, json
          from urllib.request import Request, urlopen
          from datetime import datetime, timezone, timedelta
          end=datetime.now(timezone.utc)
          start=end-timedelta(days=365)
          body={
            "query": "query($login:String!, $from:DateTime!, $to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}",
            "variables":{"login":"AdityaSreevatsaK","from":start.isoformat(),"to":end.isoformat()}
          }
          req=Request("https://api.github.com/graphql",data=json.dumps(body).encode("utf-8"),
                      headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                               "Accept":"application/vnd.github+json",
                               "User-Agent":"open-source-metro-calendar-probe"},
                      method="POST")
          with urlopen(req,timeout=20) as response:
              result=json.loads(response.read(1500000).decode("utf-8"))
          if result.get("errors"):
              raise RuntimeError("GraphQL public calendar query failed: "+str([e.get("type") for e in result["errors"]]))
          obj=result["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          days=[d for w in obj["weeks"] for d in w["contributionDays"] if d["contributionCount"]>0]
          print("PUBLIC PROFILE CONTRIBUTION CALENDAR TOTAL:",obj["totalContributions"])
          print("NONZERO CALENDAR DAYS:",len(days))
          print("FIRST/LAST NONZERO DATES:",days[0]["date"] if days else "none",days[-1]["date"] if days else "none")
          assert obj["totalContributions"] >= 0 and len(obj["weeks"]) >= 50
