name: Generate mobile preview SVG assets
on:
  push:
    branches: [feat/public-events-and-mobile]
    paths:
      - .github/workflows/generate-mobile-previews.yml

permissions:
  contents: write

jobs:
  render:
    if: github.repository == 'AdityaSreevatsaK/Open-Source-Metro'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/public-events-and-mobile
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Build canonical SVG assets from fixture
        run: |
          python -m pip install -e .
          python -m open_source_metro.mobile_profile --input examples/demo-activity.json --output assets/living-mobile-fixture.svg
          python -m open_source_metro.mobile_profile --input examples/demo-activity.json --output assets/living-mobile-showcase.svg --showcase
          python -m open_source_metro.mobile_profile --input examples/demo-activity.json --output assets/living-mobile-paper.svg --showcase --theme paper
      - name: Commit generated examples
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/living-mobile-fixture.svg assets/living-mobile-showcase.svg assets/living-mobile-paper.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: add deterministic mobile profile SVG previews"
          git push origin HEAD:feat/public-events-and-mobile
