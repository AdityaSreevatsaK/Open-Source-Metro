name: Build compact design examples
on:
  push:
    branches: [design/living-network-v1]

permissions:
  contents: write

jobs:
  generate-compact-assets:
    if: github.repository == 'AdityaSreevatsaK/Open-Source-Metro'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install optional animation extras
        run: python -m pip install -e ".[animation]"
      - name: Test source-backed output before generating
        run: python -m unittest discover -s tests -v
      - name: Generate checked-in compact variants
        run: |
          python -m open_source_metro.compact_profile --input examples/demo-activity.json --output assets/living-compact-showcase.svg --showcase
          python -m open_source_metro.compact_profile --input examples/demo-activity.json --output assets/living-compact-paper.svg --showcase --theme paper
          python -m open_source_metro.compact_profile --input examples/demo-activity.json --output assets/living-compact-fixture.svg
          python tools/render_compact_gif.py --input examples/demo-activity.json --output assets/living-compact-replay.gif --showcase --frames 26 --width 850 --duration-ms 140
      - name: Verify assets and update only design branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from PIL import Image
          files=('living-compact-showcase.svg','living-compact-paper.svg','living-compact-fixture.svg')
          for file in files:
              path=Path('assets')/file
              assert 1000<path.stat().st_size<230000, str(path)
              root=ET.parse(path).getroot()
              assert root.tag.endswith('svg')
          gif=Path('assets/living-compact-replay.gif')
          with Image.open(gif) as im:
              assert im.n_frames>=24 and im.width==850, (im.n_frames,im.size)
          assert gif.stat().st_size<1000000, gif.stat().st_size
          PY
          git add assets/living-compact-showcase.svg assets/living-compact-paper.svg assets/living-compact-fixture.svg assets/living-compact-replay.gif
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets(metro): generate reproducible compact profile showcase and replay [skip ci]'
            git push origin HEAD:refs/heads/design/living-network-v1
          fi
